<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presentaciones de Proyectos</title>

    <!-- Fuente futurista -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            min-height: 100vh;
            font-family: 'Orbitron', sans-serif;
            background:
                radial-gradient(circle at top left, rgba(0,255,255,.15), transparent 25%),
                radial-gradient(circle at bottom right, rgba(140,0,255,.15), transparent 25%),
                linear-gradient(135deg, #050816, #0b1023, #050816);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
            position: relative;
        }

        /* Fondo animado */
        body::before{
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background-image:
                linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: moveGrid 15s linear infinite;
            transform: rotate(10deg);
        }

        @keyframes moveGrid{
            0%{
                transform: translate(0,0) rotate(10deg);
            }
            100%{
                transform: translate(-60px,-60px) rotate(10deg);
            }
        }

        .container{
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 1000px;
            padding: 50px;
            border-radius: 30px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow:
                0 0 30px rgba(0,255,255,.15),
                0 0 60px rgba(140,0,255,.10);
            text-align: center;
        }

        .title{
            font-size: clamp(2rem, 5vw, 4rem);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(to right, #00ffff, #8a2be2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle{
            color: rgba(255,255,255,0.7);
            margin-bottom: 50px;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .buttons{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .btn{
            position: relative;
            text-decoration: none;
            color: white;
            padding: 22px;
            border-radius: 18px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            transition: .4s ease;
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0,255,255,.08);
        }

        .btn::before{
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(0,255,255,.25),
                transparent
            );
            transform: rotate(25deg);
            transition: .6s;
        }

        .btn:hover::before{
            left: 100%;
        }

        .btn:hover{
            transform: translateY(-8px) scale(1.03);
            border-color: rgba(0,255,255,.5);
            box-shadow:
                0 0 20px rgba(0,255,255,.35),
                0 0 40px rgba(138,43,226,.25);
        }

        .footer{
            margin-top: 40px;
            font-size: .8rem;
            color: rgba(255,255,255,.4);
            letter-spacing: 2px;
        }

        @media (max-width: 600px){

            .container{
                padding: 30px 20px;
            }

            .btn{
                padding: 18px;
                font-size: .9rem;
            }

        }
    </style>
</head>
<body>

    <div class="container">

        <h1 class="title">Presentaciones de Proyectos</h1>

        <p class="subtitle">
            Accede a cada presentación interactiva
        </p>

        <div class="buttons">

            <a href="investigacionFCal/ppt1.html" class="btn">
                Proyecto 01
            </a>

            <a href="investigacionFCal/ppt2.html" class="btn">
                Proyecto 02
            </a>

            <a href="investigacionFCal/ppt3.html" class="btn">
                Proyecto 03
            </a>

            <a href="investigacionFCal/ppt4.html" class="btn">
                Proyecto 04
            </a>

        </div>

        <div class="footer">
            FUTURISTIC INTERFACE • 2026
        </div>

    </div>

</body>
</html>
